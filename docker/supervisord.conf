; =============================================================
; supervisord — gestor de procesos del container CRM
; =============================================================
; Reemplaza el patrón `php-fpm -D` + `nginx foreground` del
; docker-entrypoint.sh anterior. La razón: agregar un queue
; worker persistente para `php artisan queue:work` que antes
; no existía en el container (y que rompía el sync de Mercurio
; porque los webhooks quedaban en la tabla `jobs` sin procesar).
;
; Supervisord corre como PID 1 y mantiene los 3 programas vivos
; con `autorestart=true`. Logs en `/var/log/`.
;
; Orden de prioridad: php-fpm (10) → nginx (20) → laravel-worker (30).
; Supervisord arranca en orden ascendente y aplica backoff en restart.
; =============================================================

[supervisord]
nodaemon=true
logfile=/var/log/supervisord.log
logfile_maxbytes=10MB
logfile_backups=5
loglevel=info
pidfile=/var/run/supervisord.pid
minfds=1024
minprocs=200
childlogdir=/var/log

; -------------------------------------------------------------
; PHP-FPM (background, escucha en :9000 vía nginx upstream)
; -------------------------------------------------------------
[program:php-fpm]
command=/usr/local/sbin/php-fpm -F
autostart=true
autorestart=true
priority=10
startsecs=1
startretries=3
stopsignal=QUIT
stopwaitsecs=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; -------------------------------------------------------------
; Nginx (foreground, puerto :80)
; -------------------------------------------------------------
[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
priority=20
startsecs=1
startretries=3
stopsignal=QUIT
stopwaitsecs=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; -------------------------------------------------------------
; Laravel queue worker (webhooks queue)
; -------------------------------------------------------------
; Args coinciden con el contrato de `DispatchOutboundWebhookJob`:
;   - `--queue=webhooks`  → única queue que este worker consume
;   - `--tries=3`         → match con $tries=3 del job (3 retries antes de failed_jobs)
;   - `--timeout=60`      → match con --backoff del job (60,120,180s)
;   - `--max-time=3600`   → restart cada hora (Laravel best practice para evitar
;                            memory leaks en workers long-lived)
;   - `--sleep=3`         → idle poll entre jobs
;   - `--backoff=60`      → intervalo entre reintentos
;
; numprocs=1 por ahora. Si el throughput lo pide, subir a 2-3 con cuidado
; de no duplicar jobs (la queue en DB ya deduplica por atomicidad).
[program:laravel-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/html/artisan queue:work --queue=webhooks --tries=3 --timeout=60 --max-time=3600 --sleep=3 --backoff=60
autostart=true
autorestart=true
priority=30
startsecs=1
startretries=3
stopwaitsecs=15
stopsignal=TERM
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
numprocs=1

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface