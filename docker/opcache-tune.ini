; OPcache tuned for Docker bind-mount on Windows host.
; validate_timestamps=0 skips per-request stat() on ~7.375 vendor files,
; avoiding ~7s of filesystem overhead per request through the bind mount.
; Safe in dev: files don't change between requests; restart container to
; pick up changes.
opcache.validate_timestamps=0
opcache.revalidate_freq=0
opcache.max_accelerated_files=20000
opcache.memory_consumption=256
opcache.fast_shutdown=1