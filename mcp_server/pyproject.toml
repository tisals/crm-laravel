[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "empresas-colombia"
version = "0.1.0"
description = "FastMCP server for Colombian company enrichment (Socrata + RUES + Decreto 768/2022)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [
    { name = "Tecnoinnsoft CRM Team" }
]
dependencies = [
    "fastmcp>=0.4",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]

[project.scripts]
empresas-colombia-mcp = "empresas_colombia.server:cli"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: marks integration tests that spawn subprocesses or hit real network (deselect with '-m \"not integration\"')",
    "timeout: per-test timeout (requires pytest-timeout; not strictly required).",
]
filterwarnings = [
    "ignore::DeprecationWarning:authlib.*",
    "ignore::DeprecationWarning:fastmcp.*",
    "ignore::pytest.PytestUnknownMarkWarning",
]