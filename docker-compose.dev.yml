# Project name override: forces docker compose resources (containers, networks,
# volumes) to be prefixed with `minerva_*` instead of being derived from the
# directory name (`crm-laravel_*`). Without this, the containers show up under
# `docker compose ls` / `docker ps` labels as belonging to project "crm-laravel"
# even though they're named `minerva-backend` / `minerva-dashboard`.
name: minerva

services:
  crm:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: minerva-backend
    ports:
      - "8001:80"
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - DB_CONNECTION=mysql
      - DB_HOST=mariadb
      - DB_PORT=3306
      # Variant A dual-write (sunset 2027-02-06): CRM usa `minerva` (nuevo),
      # `tecnoinnsoft_crm` queda intacta como rollback target. Cleanup el 2027-02-06:
      # DROP DATABASE tecnoinnsoft_crm.
      - DB_DATABASE=minerva
      - DB_USERNAME=root
      - DB_PASSWORD=sailus_root_dev
      # DEBT: Redis de Mercurio NO está aún en sailus-shared (solo mariadb).
      # Por eso usamos cache/session/queue=database (drivers default del .env.example)
      # en vez de redis. Cuando Mercurio exponga Redis en sailus-shared, descomentar:
      #   CACHE_STORE=redis
      #   SESSION_DRIVER=redis
      #   QUEUE_CONNECTION=redis
      #   REDIS_HOST=redis
      #   REDIS_PORT=6379
      #   REDIS_CLIENT=phpredis
      # ============================================================
      # Webhook config — sync Mercurio (canonical: personas-snapshot)
      # ============================================================
      # IMPORTANTE: la URL debe incluir `/v1/` — el alias `/api/webhook/`
      # sin version está bloqueado por el middleware de Mercurio (open_paths).
      # Antes del sunset 2026-10-10 migrar al secret dedicado:
      #   PERSONA_SNAPSHOT_WEBHOOK_SECRET=...
      # Mientras tanto, el Elvis fallback firma con WEBHOOK_OUTBOUND_SECRET,
      # que DEBE matchear MERCURIO_PERSONAS_HOOK_SECRET del lado Mercurio.
      - PERSONA_SNAPSHOT_WEBHOOK_URL=http://mercurio-fastapi-dev:8000/api/v1/webhook/personas-snapshot
      # Defensive fallback ONLY — `.env` (bind-mounted en dev) es la fuente
      # de verdad. Este placeholder NO matchea con Mercurio, así que cualquier
      # deploy sin `.env` mount va a tirar 401 en el receiver. En prod,
      # setear via secrets manager / runtime env, NO commitear valores reales.
      - PERSONA_SNAPSHOT_WEBHOOK_SECRET=${PERSONA_SNAPSHOT_WEBHOOK_SECRET:-REPLACE_ME_FROM_SECRETS_MANAGER}
      - EMIT_PERSONA_SNAPSHOT_WEBHOOK=true
      # Mismo patrón para entidades-snapshot (no usado por el bug actual,
      # pero seteado por completitud y consistencia).
      - ENTIDADES_SNAPSHOT_WEBHOOK_URL=http://mercurio-fastapi-dev:8000/api/v1/webhook/entidades-snapshot
      - EMIT_ENTIDADES_SNAPSHOT_WEBHOOK=true
    volumes:
      - ./app:/var/www/html/app
      - ./config:/var/www/html/config
      - ./database:/var/www/html/database
      - ./public:/var/www/html/public
      - ./resources:/var/www/html/resources
      - ./bootstrap:/var/www/html/bootstrap
      - ./routes:/var/www/html/routes
      - ./storage:/var/www/html/storage
      - ./tests:/var/www/html/tests
      - ./.env:/var/www/html/.env
      - ./vendor:/var/www/html/vendor
      - ./Modules:/var/www/html/Modules
      - ./modules_statuses.json:/var/www/html/modules_statuses.json
      # Bind-mount nginx.conf para que cambios de config se apliquen
      # con `docker exec minerva-backend nginx -s reload` sin rebuild.
      # Si el archivo no existe en el host, se usa el del COPY del Dockerfile.
      - ./nginx.conf:/etc/nginx/http.d/default.conf:ro
    networks:
      - dev
      - sailus-shared

  dashboard:
    build:
      context: ../dashboard-crm
      dockerfile: Dockerfile
      target: dev
    container_name: minerva-dashboard
    ports:
      - "5174:5174"
    volumes:
      - ../dashboard-crm/src:/app/src
      - ../dashboard-crm/public:/app/public
      - ../dashboard-crm/index.html:/app/index.html
      - ../dashboard-crm/vite.config.ts:/app/vite.config.ts
      - ../dashboard-crm/tsconfig.json:/app/tsconfig.json
      - ../dashboard-crm/tsconfig.node.json:/app/tsconfig.node.json
      - ../dashboard-crm/tailwind.config.js:/app/tailwind.config.js
      - ../dashboard-crm/postcss.config.js:/app/postcss.config.js
    environment:
      - VITE_API_BASE_URL=http://localhost:8001/api/v1
    networks:
      - dev

networks:
  dev:
    driver: bridge
  sailus-shared:
    external: true
