services:
  crm:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: minerva-backend
    ports:
      - "8001:80"
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - DB_CONNECTION=mysql
      # DEBT: mariadb no está en sailus-shared (es interno de Mercurio).
      # Workaround dev: CRM está join a mercurio_sailus-dev directa (ver networks
      # arriba) y resuelve mariadb por hostname. Fix definitivo: pedir a Mercurio
      # que agregue mariadb a sailus-shared, entonces remover el join a su network
      # interna y mantener DB_HOST=mariadb:3306.
      - DB_HOST=mariadb
      - DB_PORT=3306
      - DB_DATABASE=tecnoinnsoft_crm
      - DB_USERNAME=root
      - DB_PASSWORD=sailus_root_dev
      - CACHE_STORE=redis
      - SESSION_DRIVER=redis
      - QUEUE_CONNECTION=redis
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_CLIENT=phpredis
    volumes:
      - ./app:/var/www/html/app
      - ./config:/var/www/html/config
      - ./database:/var/www/html/database
      - ./public:/var/www/html/public
      - ./resources:/var/www/html/resources
      - ./bootstrap:/var/www/html/bootstrap
      - ./routes:/var/www/html/routes
      - ./storage:/var/www/html/storage
      - ./tests:/var/www/html/tests
      - ./.env:/var/www/html/.env
      - ./vendor:/var/www/html/vendor
      - ./Modules:/var/www/html/Modules
      - ./modules_statuses.json:/var/www/html/modules_statuses.json
    networks:
      - minerva-dev
      - sailus-shared
      # DEBT: mariadb de Mercurio NO está en sailus-shared (es interno de su stack).
      # Para dev, hacemos join a su network interna directamente. Cuando Mercurio
      # exponga mariadb en sailus-shared, remover esta línea y volver a DB_HOST=mariadb.
      - mercurio_sailus-dev
    extra_hosts:
      # Resuelve host.docker.internal para acceder a puertos publicados por otros
      # stacks (Mercurio expone mariadb en host:3307 — ver DEBT en DB_HOST abajo).
      - "host.docker.internal:host-gateway"

  dashboard:
    build:
      context: ../dashboard-crm
      dockerfile: Dockerfile
      target: dev
    container_name: minerva-dashboard
    ports:
      - "5174:5174"
    volumes:
      - ../dashboard-crm/src:/app/src
      - ../dashboard-crm/public:/app/public
      - ../dashboard-crm/index.html:/app/index.html
      - ../dashboard-crm/vite.config.ts:/app/vite.config.ts
      - ../dashboard-crm/tsconfig.json:/app/tsconfig.json
      - ../dashboard-crm/tsconfig.node.json:/app/tsconfig.node.json
      - ../dashboard-crm/tailwind.config.js:/app/tailwind.config.js
      - ../dashboard-crm/postcss.config.js:/app/postcss.config.js
    environment:
      - VITE_API_BASE_URL=http://localhost:8001/api/v1
    networks:
      - minerva-dev

networks:
  minerva-dev:
    driver: bridge
  sailus-shared:
    external: true
  # DEBT: ver comentario en services.crm.networks arriba.
  mercurio_sailus-dev:
    external: true
    name: mercurio_sailus-dev
